<rect width="1600" height="980" fill="#fff"/><text x="50" y="48" class="t">Video Streaming System: Upload, processing and global playback</text><text x="50" y="76" class="st">The control plane manages identity and metadata; large files bypass the API; the asynchronous pipeline generates multi-bitrate media; and the CDN is responsible for global playback.</text>
